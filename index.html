<style>
:root{
  --bg:#0B0B0D;--card:#141416;--card2:#1B1B1E;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#F4F0E8;--muted:#A6A198;--dim:#8C877E;--red:#E3221C;--red2:#FF5148;--gold:#E8BC5A;--green:#3CCB7F;--blue:#5B8CFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050506;color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:calc(104px + env(safe-area-inset-bottom));overflow-x:hidden}

.wrap{padding:calc(16px + env(safe-area-inset-top)) 18px 24px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.topbar .emb{width:38px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(227,34,28,.35))}
.brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.brand b{font-family:Unbounded,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;color:var(--text)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:25px;letter-spacing:-.6px;margin:0;line-height:1.15}
.h2{font-family:Unbounded,sans-serif;font-size:14px;font-weight:600;margin:0;letter-spacing:-.1px}
.eyebrow{font-size:11px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase;font-weight:700}
.card{background:linear-gradient(180deg,#161618,#121214);border:1px solid var(--line);border-radius:22px;padding:18px}

.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:12px}.sm{font-size:13px}
.num{font-family:Unbounded,sans-serif;font-weight:700}

.stat span{font-size:11px;color:var(--muted)}
.btn{height:52px;border-radius:16px;border:0;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn-light{background:var(--text);color:#0A0A0B}
.btn-red{background:linear-gradient(180deg,#F02A22,#C8150F);color:#fff;box-shadow:0 10px 24px -10px rgba(227,34,28,.7)}
.btn-ghost{background:var(--card2);border:1px solid var(--line2);color:var(--text)}
.btn-sm{height:36px;border-radius:11px;font-size:12px;font-weight:800;padding:0 12px;width:auto;border:1px solid var(--line2);background:var(--card2);color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-sm.red{background:var(--red);border-color:var(--red);color:#fff}
.link{background:none;border:0;color:var(--red2);font-weight:800;font-size:12px;padding:6px 0}
.pill{height:26px;padding:0 10px;border-radius:13px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-ok{background:rgba(60,203,127,.13);color:#72E2A5}

.pill-wait{background:rgba(232,188,90,.14);color:var(--gold)}

.ava{width:44px;height:44px;border-radius:50%;background:#222226;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#CFC9BF;flex-shrink:0;overflow:hidden}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--text)}
.li:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:3px}
.belt{width:60px;height:12px;border-radius:2px;position:relative;flex-shrink:0}
.belt::after{content:"";position:absolute;right:10px;top:0;width:6px;height:100%;background:rgba(0,0,0,.55)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(416px,calc(100% - 24px));height:68px;border-radius:24px;background:rgba(22,22,25,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);display:grid;z-index:20;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}

.tab.on{color:var(--text)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--card2);border:1px solid var(--line2);color:var(--muted);font-weight:800;font-size:13px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}

.field{display:flex;flex-direction:column;gap:6px}

.input{background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:12px 14px;font-size:15px;outline:none;width:100%}
.input:focus{border-color:var(--red)}

.stars{display:flex;gap:4px}
.star{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:#55524C;padding:0}

.cmt{display:flex;flex-direction:column;gap:10px}

.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{display:flex;flex-direction:column;gap:5px}
.mini span{font-size:11px;color:var(--muted)}
.mini .bar>i{background:var(--gold)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:440px;background:#111113;border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:#2E2E33;align-self:center;margin-bottom:6px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal div{height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.photo-tile{height:140px;border-radius:18px;background:radial-gradient(circle at 30% 20%,rgba(227,34,28,.14),transparent 60%),var(--card2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--muted);position:relative}
.photo-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-tile span{position:relative;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:8px;color:#fff;font-weight:700}
.photo-tile .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{min-height:100vh;display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 22px 30px;gap:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:50%;top:60px;width:520px;height:520px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(227,34,28,.30),rgba(227,34,28,.08) 55%,transparent);pointer-events:none}
.hero .emb-big{width:min(210px,56%);align-self:center;position:relative;margin-top:8px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.role{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line2);text-align:left;width:100%;position:relative;color:var(--text)}
.role .ri{width:42px;height:42px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--red2);flex-shrink:0}
.role.main{background:linear-gradient(135deg,#F02A22,#A3110C);border-color:transparent}
.role.main .ri{background:rgba(255,255,255,.16);color:#fff}
.pass{position:relative;border-radius:26px;padding:20px;overflow:hidden;background:linear-gradient(140deg,#F2291F 0%,#B5140E 48%,#5E0906 100%);box-shadow:0 24px 50px -20px rgba(227,34,28,.65);color:#fff;border:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:18px}
.pass .wm{position:absolute;right:-58px;top:-34px;width:180px;opacity:.10;pointer-events:none;filter:grayscale(1) brightness(2)}
.pass .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);pointer-events:none}
.coin{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.lead-me{background:rgba(227,34,28,.09);border-radius:14px;margin:0 -10px;padding-left:10px!important;padding-right:10px!important}
.evt-date{width:56px;height:60px;border-radius:15px;background:var(--card2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.evt-date b{font-family:Unbounded,sans-serif;font-size:19px}

.prize{display:flex;flex-direction:column;gap:10px;padding:14px}

.flame{color:#FF7A2E}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:linear-gradient(180deg,#161618,#121214);border:1px solid var(--line);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:12px;font-weight:800;color:var(--text);min-height:104px;justify-content:center;position:relative}
.tile .ti{width:44px;height:44px;border-radius:14px;background:rgba(227,34,28,.12);color:var(--red2);display:flex;align-items:center;justify-content:center}
.tile.gold .ti{background:rgba(232,188,90,.12);color:var(--gold)}

.tile .badge{position:absolute;top:8px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:120px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}

.vbars span{font-size:10px;color:var(--dim);font-weight:700}

.timer-num{font-family:Unbounded,sans-serif;font-weight:800;font-size:76px;letter-spacing:-2px;text-align:center;line-height:1}
.ring{width:240px;height:240px;border-radius:50%;margin:6px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.match{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}

.corner{width:6px;height:28px;border-radius:3px;flex-shrink:0}
.cert{background:linear-gradient(160deg,#FBF7EF,#EDE5D6);color:#141414;border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;overflow:hidden;border:6px double #B8932F}

.ai-out{white-space:pre-wrap;font-size:14px;line-height:1.6;color:#E6E0D6}
.ai-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(227,34,28,.22));font-size:11px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--muted);text-align:left;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}

.chk{width:24px;height:24px;border-radius:8px;border:2px solid #45454B;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk.on{background:var(--green);border-color:var(--green);color:#0A0A0B}
.badge-a{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 8px}
.badge-a .bi{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.badge-a.off{opacity:.38}
</style>

function qrSvg(seed,size){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=21,cell=size/n;let r='';
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h%100};
  const finder=(x,y)=>x<7&&y<7||x>=n-7&&y<7||x<7&&y>=n-7;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(finder(x,y)){const fx=x>=n-7?x-(n-7):x,fy=y>=n-7?y-(n-7):y;on=fx===0||fy===0||fx===6||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)}else on=rnd()<46;
    if(on)r+=`<rect x="${(x*cell).toFixed(2)}" y="${(y*cell).toFixed(2)}" width="${(cell+.3).toFixed(2)}" height="${(cell+.3).toFixed(2)}"/>`}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#0A0A0B" role="img" aria-label="QR-код">${r}</svg>`;
}

function statsKpi(){
  const n=D.students.length,paid=D.students.filter(s=>s.paid).length;
  const att=Math.round(D.students.reduce((a,s)=>a+s.came/s.total,0)/n*100);
  const medals=D.students.reduce((a,s)=>a+s.medals.length,0);
  const comp=new Set(D.events.filter(e=>e.type==='Турнир').flatMap(e=>e.reg)).size;
  return {n,paid,att,medals,comp,newS:3,left:1};
}

async function runAI(key,prompt){
  S.ai={key,text:'',busy:true,demo:!SAMPLE};render();
  const el=()=>document.getElementById('ai-out');
  if(!SAMPLE){
    const full=fallbackAI(key);let i=0;
    const step=()=>{i=Math.min(full.length,i+6);S.ai.text=full.slice(0,i);const e=el();if(e)e.textContent=S.ai.text;if(i<full.length)setTimeout(step,14);else{S.ai.busy=false;render()}};step();return;
  }
  const sys=`Ты — ИИ-помощник приложения карате-клуба. Отвечай по-русски, коротко и по делу, без markdown-заголовков и без звёздочек, простым текстом со списками через «•» или цифры. Ты помогаешь тренеру и не ставишь медицинских диагнозов и не решаешь вопросы допуска к соревнованиям.\n\nДанные клуба:\n${ctxText()}\n\nТема сегодняшней тренировки: ${D.topic}.\n\nЗапрос: ${prompt.replace('{topic}',D.topic)}`;
  try{
    const r=await SAMPLE(sys,{modelTier:'quick',cache:false,onText:({text})=>{S.ai.text=text;const e=el();if(e)e.textContent=text}});
    S.ai.text=r.text;
  }catch(err){S.ai.text=fallbackAI(key);S.ai.demo=true}
  S.ai.busy=false;render();
}

    case 'receipt':{const x=st(X.sid);return wrap(`<div style="background:#F7F3EC;color:#141414;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;font-size:13px"><div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="background:#0B0B0D;border-radius:12px;padding:6px 8px"><img src="emblem.png" alt="" style="width:40px;display:block"></div><b style="font-family:Unbounded;font-size:14px">ЭЛЕКТРОННЫЙ ЧЕК</b><span style="color:#6B665E">№ KTC-${(Date.now()%100000).toString().padStart(5,'0')} · ${today()} 2026</span></div>
      <div style="border-top:1px dashed #BDB6A8"></div>${[['Плательщик',x.name],['Услуга','Абонемент · ноябрь'],['Группа',grp(x.group).name],['Способ','Payme'],['Получатель','Karate Tashkent City']].map(([a,b])=>`<div class="between"><span style="color:#6B665E">${a}</span><b>${esc(b)}</b></div>`).join('')}<div style="border-top:1px dashed #BDB6A8"></div><div class="between"><b>Итого</b><b style="font-family:Unbounded;font-size:16px">${money(PRICES.month)}</b></div></div>

    case 'cert':{const x=st(X.sid),a=x.attests[X.i];return wrap(`<div class="cert"><div style="background:#0B0B0D;border-radius:18px;padding:8px 12px"><img class="em" src="emblem.png" alt=""></div><span style="font-size:11px;letter-spacing:3px;color:#8A6A1E;font-weight:800">KARATE TASHKENT CITY</span><h3>СЕРТИФИКАТ</h3><span style="font-size:13px;color:#5E5A53">настоящим подтверждается, что</span><b style="font-family:Unbounded;font-size:19px">${esc(x.name)}</b><span style="font-size:13px;color:#5E5A53;line-height:1.5">успешно сдал(а) аттестацию<br>и присвоен пояс</span>
      <div class="row" style="gap:10px;margin:4px 0"><span style="width:56px;height:12px;border-radius:2px;background:${BELTS[a.to].c};border:1px solid #0002"></span><b style="font-family:Unbounded;font-size:16px">${a.to===0?'1 ДАН':a.to+' КЮ'}</b></div>
      <div class="between" style="width:100%;margin-top:10px;font-size:12px;color:#5E5A53"><div style="text-align:left">Дата<br><b style="color:#141414">${esc(a.d)}</b></div><div style="text-align:center">Оценка<br><b style="color:#141414">${a.score}</b></div><div style="text-align:right">Сенсей<br><b style="color:#141414;font-style:italic">Рустам</b></div></div></div>
      <button class="btn btn-ghost" data-a="closesheet" type="button">Закрыть</button>`)}
    case 'pass':return wrap(`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center"><span class="eyebrow">Цифровой паспорт каратиста</span><div style="background:#F4F0E8;padding:16px;border-radius:20px">${qrSvg(s.id+s.name,190)}</div><b style="font-family:Unbounded;font-size:18px">${esc(s.name)}</b><span class="sm muted">${beltTxt(s.kyu)} · ${s.weight} кг · ${esc(coachOf(s).name)}</span><span class="small dim">Покажите QR на входе — посещение отметится автоматически, а вы получите ${coinTxt(5,13)}</span></div>
      <div class="grid2"><button class="btn btn-ghost" type="button" data-a="go" data-v="profile">Профиль</button><button class="btn btn-ghost" type="button" data-a="go" data-v="belt">Пояс</button></div>`);
    case 'qr':{const ab=D.students.filter(x=>x.group==='g2'&&x.att==='a');return wrap(`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center"><span class="eyebrow">Сканер QR</span><div style="width:220px;height:220px;border-radius:24px;background:#0A0A0B;border:2px solid var(--line2);position:relative;display:flex;align-items:center;justify-content:center;color:var(--dim)">${ic('qr',64)}<span style="position:absolute;left:16px;right:16px;top:50%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red)"></span></div><span class="sm muted">В полной версии откроется камера телефона. Наведите на QR ученика — посещение отметится само.</span></div>
      ${ab.length?`<button class="btn btn-red" type="button" data-a="qrscan" data-v="${ab[0].id}">Демо: отсканировать ${esc(ab[0].name)}</button>`:'<p class="sm" style="text-align:center;margin:0">Все ученики уже отмечены</p>'}`)}
    case 'feed':return wrap(`<h2 class="h2" style="font-size:18px">Уведомления</h2><div class="list">${D.feed.map(f=>`<div class="li"><span style="width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:${f.ic==='coin'?'var(--gold)':'var(--red2)'};flex-shrink:0">${f.ic==='coin'?coinIc(18):ic(f.ic,18)}</span><div style="flex:1"><div class="sm" style="font-weight:700;line-height:1.4">${esc(f.t)}</div><div class="small dim">${esc(f.d)}</div></div></div>`).join('')}</div>`);
    case 'install':return wrap(`<h2 class="h2" style="font-size:18px">Установить на телефон</h2>
      <div class="row" style="gap:14px"><img src="icon-192.png" alt="" style="width:60px;height:60px;border-radius:16px"><div><b>Karate Tashkent City</b><div class="small muted">Иконка на главном экране, открывается без браузера</div></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><b class="sm">iPhone (Safari)</b><span class="sm muted" style="line-height:1.55">1. Откройте ссылку в Safari<br>2. Нажмите «Поделиться» внизу экрана<br>3. Выберите «На экран Домой» → «Добавить»</span></div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><b class="sm">Android (Chrome)</b><span class="sm muted" style="line-height:1.55">1. Откройте ссылку в Chrome<br>2. Нажмите ⋮ в правом верхнем углу<br>3. Выберите «Установить приложение» или «Добавить на главный экран»</span></div>
      <button class="btn btn-light" data-a="closesheet" type="button">Понятно</button>`);
    case 'msg':return wrap(`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center"><div style="width:60px;height:60px;border-radius:50%;background:${X.ok?'var(--green)':'var(--card2)'};display:flex;align-items:center;justify-content:center;color:${X.ok?'#0A0A0B':'var(--red2)'}">${ic(X.icon||'ok',28)}</div><h2 class="h2" style="font-size:18px">${esc(X.t)}</h2><p class="sm muted" style="margin:0;line-height:1.55">${esc(X.d)}</p></div><button class="btn btn-light" data-a="closesheet" type="button">Понятно</button>`);

/* =================== УСТАНОВКА (PWA) =================== */
const STANDALONE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
let INSTALL_EVT=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e});
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

/* =================== РЕНДЕР И СОБЫТИЯ =================== */
function render(){
  const v=!S.role?vLogin():S.role==='admin'?vAdmin():S.role==='coach'?(S.open?`<div class="wrap">${topbar()}${vStudentCoach(st(S.open))}</div>`+tabbar(COACH_TABS):vCoach()):S.role==='athlete'?vAthlete():vParent();
  document.getElementById('app').innerHTML=v;
  document.getElementById('layer').innerHTML=vSheet();
}
let tt;
function toast(t){clearTimeout(tt);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.innerHTML=t;tt=setTimeout(()=>el.remove(),2600)}
const top0=()=>window.scrollTo(0,0);
const nm=s=>s.name.split(' ')[0];

/* таймер */
setInterval(()=>{
  const now=performance.now(),dt=(now-(T.last||now))/1000;T.last=now;
  if(T.run){T.left-=dt;if(T.left<=0){if(T.phase==='work'){if(T.cur>=T.rounds){T.run=false;T.phase='idle';T.cur=1;T.left=T.work;toast('Бой окончен!');render();return}T.phase='rest';T.left=T.rest}else{T.cur++;T.phase='work';T.left=T.work}render();return}
    const e=document.getElementById('tm-num');if(e)e.textContent=fmt(T.left);const r=document.querySelector('.ring');if(r){const tot=T.phase==='rest'?T.rest:T.work;r.style.background=`conic-gradient(${T.phase==='rest'?'var(--green)':'var(--red)'} ${(1-T.left/tot)*360}deg,rgba(255,255,255,.06) 0)`}}
  if(T.swRun){T.sw+=dt*1000;const e=document.getElementById('sw-num');if(e)e.textContent=fmtSw(T.sw)}
},100);

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-a]');if(!btn)return;
  const a=btn.dataset.a,v=btn.dataset.v;
  if(a==='closesheet'&&btn.classList.contains('sheet-bg')&&e.target.closest('[data-stop]'))return;
  switch(a){
    case 'role':S={...S,role:v,tab:'home',open:null,sub:null,saved:false,seg:{},ai:{}};top0();break;
    case 'logout':S={...S,role:null,open:null,sub:null};top0();break;
    case 'tab':S.tab=v;S.open=null;S.sub=null;S.saved=false;S.ai={};top0();break;
    case 'sub':S.sub=v;S.ai={};top0();break;
    case 'go':S.sheet=null;S.sub=v;top0();break;
    case 'open':S.open=v;S.sub=null;S.draft={type:'Тренировка',r:[0,0,0],text:''};S.seg.stbelt='0';top0();break;
    case 'close':if(S.open)S.open=null;else S.sub=null;S.ai={};top0();break;
    case 'seg':{const [k,val]=v.split('|');S.seg[k]=val;break}
    case 'dtype':S.draft.type=v;break;
    case 'rate':{const [i,val]=v.split('|').map(Number);S.draft.r[i]=val;break}
    case 'quick':S.draft.text=(S.draft.text?S.draft.text.trim()+' ':'')+v+'.';break;
    case 'sendc':{const s=st(v),d=S.draft;if(!d.text.trim()){toast('Напишите комментарий');return}s.comments.unshift({id:'c'+pid(),d:today(),type:d.type,r:[...d.r],text:d.text.trim()});feed('Новый отзыв тренера для '+nm(s)+': «'+d.text.trim().slice(0,60)+'»','chat');S.draft={type:'Тренировка',r:[0,0,0],text:''};save();toast('Отзыв отправлен спортсмену и родителям');break}
    case 'delc':{const [sid,cid]=v.split('|');const s=st(sid);s.comments=s.comments.filter(c=>c.id!==cid);save();break}
    case 'coins':{const [sid,i]=v.split('|');const s=st(sid),[,w,amt]=COIN_REASONS[+i];addCoins(s,amt,w);feed(`${nm(s)}: ${amt>0?'+':''}${amt} коинов — ${w}`,'coin');save();toast(`${coinIc(16)} ${amt>0?'+':''}${amt} · ${esc(s.name)}`);break}
    case 'req':{const [sid,i]=v.split('|');const s=st(sid);s.req[+i]=!s.req[+i];save();break}
    case 'attest':S.sheet={k:'attest',sid:v};break;
    case 'cert':{const [sid,i]=v.split('|');S.sheet={k:'cert',sid,i:+i};break}
    case 'toggle':{const s=st(v);s.att={p:'l',l:'a',a:'p'}[s.att];S.saved=false;save();break}
    case 'qr':S.sheet={k:'qr'};break;
    case 'qrscan':{const s=st(v);s.att='p';save();S.sheet=null;S.saved=false;toast(`${ic('ok',16)} ${esc(s.name)} отмечен по QR`);break}
    case 'savetrain':{const l=D.students.filter(s=>s.group==='g2');l.forEach(s=>{if(present(s)){addCoins(s,5,'Посещение');s.streak++;s.came=Math.min(s.total,s.came+1);feed(`Сегодня ${nm(s)} ${s.att==='l'?'пришёл с опозданием на':'посетил'} тренировку. Тема занятия: ${D.topic}.`,'check')}else{s.streak=0;feed(`${nm(s)} сегодня не пришёл на тренировку «Юниоры». Всё в порядке?`,'bell')}});S.saved=true;save();toast('Сохранено · родители получили уведомления');break}
    case 'markpaid':{const s=st(v);s.paid=true;s.pays.unshift({m:'Ноябрь 2026',s:PRICES.month,via:'Наличные'});save();toast('Оплата принята');break}
    case 'remind':S.sheet={k:'msg',icon:'bell',t:'Напоминание отправлено',d:`Родители ученика «${st(v).name}» получат уведомление об оплате. В полной версии — push, Telegram или ИИ-звонок.`};break;
    case 'remindall':{const n=D.students.filter(s=>!s.paid).length;S.sheet={k:'msg',icon:'bell',t:`Отправлено ${n} напоминаний`,d:'Всем родителям должников ушло уведомление со ссылкой на оплату через Payme или Click.'};break}
    case 'receipt':S.sheet={k:'receipt',sid:v};break;
    case 'delexp':D.expenses.splice(+v,1);save();break;
    case 'addst':S.sheet={k:'add'};break;
    case 'lead':S.sheet={k:'lead'};break;
    case 'install':if(INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;render()});return}S.sheet={k:'install'};break;
    case 'call':{const l=D.leads.find(x=>x.id===v);S.sheet={k:'msg',icon:'phone',t:'Звонок',d:`${l.ph} — в полной версии звонок совершается прямо из приложения, а ИИ-ассистент может позвонить сам и записать на пробное занятие.`};break}
    case 'acceptlead':{const l=D.leads.find(x=>x.id===v);l.st='done';S.sheet={k:'add',name:l.n};break}
    case 'addevt':S.sheet={k:'evt'};break;case 'addslot':S.sheet={k:'slot'};break;case 'addprize':S.sheet={k:'prize'};break;case 'edittask':S.sheet={k:'task'};break;
    case 'delevt':D.events=D.events.filter(x=>x.id!==v);save();toast('Событие удалено');break;
    case 'delslot':D.slots=D.slots.filter(x=>x.id!==v);save();break;
    case 'delprize':D.prizes=D.prizes.filter(x=>x.id!==v);save();break;
    case 'slotok':{const x=D.slots.find(y=>y.id===v);x.status='booked';feed(`Индивидуальная ${dLabel(x.date)}, ${x.time} подтверждена`,'cal');save();toast('Запись подтверждена');break}
    case 'slotno':{const x=D.slots.find(y=>y.id===v);x.status='free';delete x.by;save();toast('Запрос отклонён');break}
    case 'book':{const x=D.slots.find(y=>y.id===v);x.status='pending';x.by=D.me;feed(`${nm(me())} хочет индивидуальную ${dLabel(x.date)}, ${x.time}`,'cal');save();S.sheet={k:'msg',ok:true,t:'Заявка отправлена',d:`${dWd(x.date)}, ${dLabel(x.date)} в ${x.time}. Тренер подтвердит запись, и придёт уведомление.`};break}
    case 'cancelslot':{const x=D.slots.find(y=>y.id===v);x.status='free';delete x.by;save();toast('Запись отменена');break}
    case 'joinevt':{const ev=D.events.find(x=>x.id===v),i=ev.reg.indexOf(D.me);if(i>=0)ev.reg.splice(i,1);else{ev.reg.push(D.me);toast('Вы записаны на «'+esc(ev.title)+'»')}save();break}
    case 'win':{const [key,i]=v.split('|');D.bracket.w[key]=+i;const [r,m]=key.split('-').map(Number);
      // сбросить последующие результаты, если победитель изменился
      let rr=r,mm=m;while(rr<2){rr++;mm=Math.floor(mm/2);delete D.bracket.w[rr+'-'+mm]}
      if(r===2){const f=D.bracket.fighters[+i];feed(`Кубок Ташкента: чемпион — ${f.n} (${f.club})`,'trophy');toast(`${ic('trophy',16)} Чемпион: ${esc(f.n)}`)}save();break}
    case 'resetbr':D.bracket.w={};save();break;
    case 'buy':{const s=me(),p=D.prizes.find(x=>x.id===v);if(s.coins<p.cost){toast(`Не хватает ${p.cost-s.coins} коинов`);return}if(p.stock<1){toast('Приз закончился');return}addCoins(s,-p.cost,'Приз: '+p.title);p.stock--;D.orders.unshift({id:'o'+pid(),sid:s.id,pid:p.id,d:today(),st:'new'});feed(`${nm(s)} получил приз «${p.title}»`,'gift');save();S.sheet={k:'msg',ok:true,icon:'gift',t:'Приз ваш!',d:`«${p.title}» — заберите у тренера на ближайшей тренировке.`};break}
    case 'giveorder':D.orders.find(o=>o.id===v).st='given';save();toast('Приз выдан');break;
    case 'taskdone':{const s=me();if(s.taskDay===todayIso())return;s.taskDay=todayIso();addCoins(s,D.task.coins,'Задание дня');save();toast(`${coinIc(16)} +${D.task.coins} за задание дня`);break}
    case 'paysheet':S.pay={what:me().paid?'single':'month'};S.sheet={k:'pay'};break;
    case 'paywhat':S.pay.what=v;break;
    case 'paydo':{const names={month:'Абонемент на месяц',single:'Разовая тренировка',indiv:'Индивидуальная тренировка'};const s=me();if(S.pay.what==='month'){s.paid=true;s.pays.unshift({m:'Ноябрь 2026',s:PRICES.month,via:v})}feed(`Оплата: ${names[S.pay.what]} · ${v}`,'wallet');save();S.sheet={k:'msg',ok:true,t:'Оплата прошла',d:`${names[S.pay.what]} — ${money(PRICES[S.pay.what])} через ${v}. Электронный чек сохранён, тренер сразу видит оплату.`};break}
    case 'pass':S.sheet={k:'pass'};break;
    case 'feed':D.seen[S.role]=D.feed.length;save();S.sheet={k:'feed'};break;
    case 'video':S.sheet={k:'msg',icon:'cam',t:'Видео с тренировки',d:'В полной версии — прямая трансляция и записи тренировок с камеры в зале.'};break;
    case 'ai':{const p=(AI_PRESETS[S.role]||[]).find(x=>x[0]===v);if(p&&!S.ai.busy)runAI(p[0],p[2]);return}
    case 'copyai':try{navigator.clipboard.writeText(S.ai.text).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))}catch(err){toast('Не удалось скопировать')}return;
    case 'tm':if(v==='toggle'){if(T.phase==='idle'){T.phase='work';T.left=T.work;T.cur=1}T.run=!T.run}else{T.run=false;T.phase='idle';T.cur=1;T.left=T.work}break;
    case 'tmset':{const [k,o]=v.split('|');T[k]=+o;if(T.phase==='idle')T.left=T.work;break}
    case 'sw':if(v==='toggle')T.swRun=!T.swRun;else if(v==='lap')T.laps.unshift(T.sw);else{T.swRun=false;T.sw=0;T.laps=[]}break;
    case 'closesheet':S.sheet=null;break;
    case 'reset':try{localStorage.removeItem(KEY)}catch(err){}D=seed();toast('Демо-данные сброшены');break;
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;
  if(k==='text')S.draft.text=e.target.value;
  if(k==='topic'){D.topic=e.target.value;save()}
  if(k==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(pos,pos)}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=new FormData(e.target),g=k=>String(f.get(k)||'').trim();
  switch(e.target.id){
    case 'f-ai':{const q=g('q');if(!q||S.ai.busy)return;runAI('custom',q);return}
    case 'f-add':{if(!g('name'))return;const dob=g('dob')||'2016-01-01';const n={id:'s'+pid(),name:g('name'),dob,age:2026-+dob.slice(0,4),weight:+g('weight')||30,group:g('group'),kyu:+g('kyu'),paid:false,att:'a',came:0,total:13,since:'2026',photo:null,photos:[],medals:[],comments:[],coins:0,streak:0,log:[],taskDay:'',req:[false,false,false,false,false,false],attests:[],pays:[]};
      D.students.push(n);S.open=n.id;S.sub=null;S.draft={type:'Тренировка',r:[0,0,0],text:''};feed('Новый ученик в клубе: '+n.name,'user');toast('Ученик добавлен');top0();break}
    case 'f-lead':D.leads.unshift({id:'l'+pid(),n:g('n'),age:+g('age')||8,ph:g('ph'),d:today(),st:'new'});feed('Новая заявка в клуб: '+g('n'),'user');save();S.sheet={k:'msg',ok:true,t:'Заявка отправлена',d:'Спасибо! Администратор клуба перезвонит и запишет на бесплатное пробное занятие.'};render();return;
    case 'f-evt':{if(!g('title')||!g('date'))return;D.events.push({id:'e'+pid(),title:g('title'),type:g('type'),date:g('date'),time:g('time')||'10:00',place:g('place')||'Зал клуба',price:g('price'),desc:g('desc'),cat:g('cat'),reg:[]});feed(`Новое событие: «${g('title')}» — ${dLabel(g('date'))}`,'flag');toast('Событие опубликовано для всех');break}
    case 'f-slot':D.slots.push({id:'sl'+pid(),date:g('date'),time:g('time'),status:'free'});toast('Время открыто для записи');break;
    case 'f-prize':D.prizes.push({id:'p'+pid(),title:g('title'),cost:Math.max(10,+g('cost')||100),stock:Math.max(1,+g('stock')||1),ic:'gift'});toast('Приз добавлен');break;
    case 'f-task':D.task={text:g('text'),coins:Math.max(1,+g('coins')||10)};D.students.forEach(s=>s.taskDay='');feed('Новое задание дня: '+g('text'),'task');toast('Задание обновлено');break;
    case 'f-exp':D.expenses.push({t:g('t'),s:Math.max(0,+g('s')||0)});save();render();return;
    case 'f-attest':{const s=st(S.sheet.sid);const sc=((+g('s0')+ +g('s1')+ +g('s2'))/3).toFixed(1);const from=s.kyu,to=Math.max(0,s.kyu-1);const d=new Date();s.attests.unshift({d:d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(),from,to,score:sc});s.kyu=to;s.req=s.req.map(()=>false);addCoins(s,100,'Новый пояс');feed(`${nm(s)} сдал аттестацию: теперь ${beltTxt(to)}! Электронный сертификат в приложении.`,'medal');save();S.sheet={k:'cert',sid:s.id,i:0};render();toast(`${ic('belt',16)} Новый пояс · +100 коинов`);return}
    default:return;
  }
  save();S.sheet=null;render();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.file;if(!k||!e.target.files[0])return;
  const img=new Image(),url=URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{const max=k==='avatar'?320:720,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);
    if(k==='gallery'){D.gallery.unshift({t:'Тренировка · '+today(),src:data});feed('Новые фото с тренировки в галерее','img')}else{const s=me();if(k==='avatar')s.photo=data;else s.photos.unshift(data)}
    save();render();toast('Фото загружено')};
  img.src=url;
});
render();
</script>
</body>
</html>
